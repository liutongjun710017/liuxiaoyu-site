<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>刘小鱼</title>
<style>
:root{--bg:#070a10;--card:#101827;--line:#1b2a40;--fg:#cfe0f5;--dim:#6b7f9e;--hi:#7fb2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.7 system-ui;padding:18px}
h1{font-size:19px;margin:0 0 4px;color:var(--hi)}small{color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
pre{white-space:pre-wrap;margin:0;font:13px/1.7 ui-monospace,monospace}
input{background:#0d1522;border:1px solid var(--line);color:var(--fg);padding:8px 10px;border-radius:8px}
button{background:#1b2a44;border:1px solid #2b4569;color:#cfe0f5;padding:8px 14px;border-radius:8px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
canvas{width:100%;height:auto;background:#04070c;border-radius:10px}
.hide{display:none}
</style></head><body>
<div id="gate">
  <h1>刘小鱼</h1><small>这里要密码</small>
  <div class="card" style="margin-top:14px"><div class="row">
    <input id="u" placeholder="用户名" autofocus><input id="pw" type="password" placeholder="密码">
    <button onclick="unlock()">进</button></div>
    <pre id="err" style="color:#ff9b9b;margin-top:8px"></pre></div>
</div>
<div id="main" class="hide">
  <h1>刘小鱼</h1><small id="when"></small>
  <div class="card"><div class="tag">身体</div><pre id="body"></pre></div>
  <div class="card"><div class="tag">记忆</div><pre id="mem"></pre></div>
  <div class="card"><div class="tag">信用</div><pre id="trust"></pre></div>
  <div class="card"><div class="tag">记忆星图 · 可以拖、可以滚</div>
    <canvas id="cv" width="900" height="900"></canvas>
    <pre id="tip" style="color:#8fb3dd;min-height:20px;margin-top:8px"></pre></div>
  <div class="card"><div class="tag">检索</div>
    <div class="row"><input id="q" placeholder="搜一段记忆" size="28"><button onclick="search()">搜</button></div>
    <table><tbody id="res"></tbody></table></div>
</div>
<script>
let DATA=null;
async function unlock(){
  const u=document.getElementById('u').value.trim();
  const pw=u+':'+document.getElementById('pw').value;
  try{
    const bin=await (await fetch('data.json.enc')).arrayBuffer();
    const salt=new TextEncoder().encode('liuxiaoyu-static-v1');
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    const iv=bin.slice(0,12), ct=bin.slice(12);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    DATA=JSON.parse(new TextDecoder().decode(plain));
    show();
  }catch(e){document.getElementById('err').textContent='密码不对，或者文件没取到';}
}
function show(){
  document.getElementById('gate').classList.add('hide');
  document.getElementById('main').classList.remove('hide');
  document.getElementById('when').textContent=DATA.time||'';
  body.textContent=DATA.body; mem.textContent=DATA.mem; trust.textContent=DATA.trust;
  draw();
}

const CV={rx:0.35,ry:0.6,zoom:1.1};
function bind3D(canvas, stars, onPick){
  const ctx=canvas.getContext('2d');
  let drag=false,lx=0,ly=0;
  function rot(p){
    const cx=Math.cos(CV.rx),sx=Math.sin(CV.rx),cy=Math.cos(CV.ry),sy=Math.sin(CV.ry);
    const y1=p.y*cx-p.z*sx, z1=p.y*sx+p.z*cx;
    return [p.x*cy+z1*sy, y1, -p.x*sy+z1*cy];
  }
  function draw(){
    const W=canvas.width,H=canvas.height,sc=Math.min(W,H)*CV.zoom;
    ctx.fillStyle='#04070c';ctx.fillRect(0,0,W,H);
    const raw=stars.map((d,i)=>{const [x,y,z]=rot({x:(d.x-0.5),y:(d.y-0.5),z:(d.z-0.5)});
      return {x,y,z,d,i};});
    let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
    for(const q of raw){mnx=Math.min(mnx,q.x);mxx=Math.max(mxx,q.x);mny=Math.min(mny,q.y);mxy=Math.max(mxy,q.y);}
    const sx=(mxx-mnx)||1, sy=(mxy-mny)||1, s0=Math.min((W*0.9)/sx,(H*0.9)/sy)*CV.zoom;
    const pts=raw.map(q=>({X:(q.x-mnx)/sx*W*0.9+W*0.05,Y:(q.y-mny)/sy*H*0.9+H*0.05,Z:q.z,d:q.d,i:q.i}));
    pts.sort((a,b)=>a.Z-b.Z);
    for(const p of pts){
      const dep=Math.max(0,Math.min(1,(p.Z+0.5)));
      const r=Math.max(1,(1.1+p.d.i*4.2)*(0.7+dep*0.7));
      const a=Math.max(.2,.2+dep*.9);
      ctx.beginPath();ctx.arc(p.X,p.Y,r,0,6.283);
      ctx.fillStyle=COLOR(p.d.k,a);ctx.fill();
    }
    return pts;
  }
  let last=[];
  function loop(){ last=draw(); if(!drag) requestAnimationFrame(()=>{}); }
  canvas.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
  addEventListener('mouseup',()=>{drag=false;});
  addEventListener('mousemove',e=>{
    if(drag){CV.ry+=(e.clientX-lx)*0.007;CV.rx+=(e.clientY-ly)*0.007;lx=e.clientX;ly=e.clientY;draw();}
    else if(onPick&&last.length){
      const r=canvas.getBoundingClientRect();
      const mx=(e.clientX-r.left)*canvas.width/r.width, my=(e.clientY-r.top)*canvas.height/r.height;
      let best=null,bd=1e9;
      for(const p of last){const d=(p.X-mx)**2+(p.Y-my)**2;if(d<bd){bd=d;best=p;}}
      onPick(bd<400?best:null);
    }
  });
  canvas.addEventListener('wheel',e=>{CV.zoom=Math.max(0.6,Math.min(2.6,CV.zoom*(e.deltaY>0?0.94:1.06)));draw();e.preventDefault();},{passive:false});
  canvas.addEventListener('touchmove',e=>{
    const t=e.touches[0]; if(!lx){lx=t.clientX;ly=t.clientY;return;}
    CV.ry+=(t.clientX-lx)*0.01; CV.rx+=(t.clientY-ly)*0.01; lx=t.clientX; ly=t.clientY; draw(); e.preventDefault();
  },{passive:false});
  canvas.addEventListener('touchend',()=>{lx=0;ly=0;});
  draw();
  window.__redraw=draw;
}
const PALETTE={person:'#7dd3fc',event:'#a5b4fc',summary:'#fbbf24',preference:'#f9a8d4',setting:'#86efac',
 style:'#fca5a5',todo:'#fdba74',glossary:'#c4b5fd',pair:'#f472b6',self:'#fde68a'};
function COLOR(k,a){const hex=PALETTE[k]||'#64748b';
  const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}

function draw(){
  const tip=t=>{const el=document.getElementById('tip');
    if(!t){el.textContent='';return;}
    const it=(DATA.items||[])[t.i]||[];
    el.textContent=(it[0]||'').slice(0,80);};
  bind3D(document.getElementById('cv'), DATA.stars||[], tip);
}
function search(){
  const q=document.getElementById('q').value.trim();
  const res=document.getElementById('res');
  if(!q){res.innerHTML='';return;}
  const hit=(DATA.items||[]).filter(x=>x[0].includes(q)).slice(0,50);
  res.innerHTML=hit.length?hit.map(x=>`<tr><td style="color:#6b7f9e">${x[2].toFixed(2)}</td><td style="color:#6b7f9e">${x[1]}</td><td>${x[0].slice(0,90)}</td></tr>`).join(''):'<tr><td>没有</td></tr>';
}
</script></body></html>
